# Fly.io config. Deploy from this folder:
#   fly launch --copy-config --no-deploy   (pick a unique app name and region)
#   fly secrets set APP_PASSWORD=your-password
#   fly deploy

app = "seedbox"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  DOWNLOAD_DIR = "/data"
  PORT = "3000"

[[mounts]]
  source = "seedbox_data"
  destination = "/data"
  initial_size = "20gb"
  # Snapshots are billed per GB; downloads can be re-fetched, so skip them.
  scheduled_snapshots = false

[http_service]
  internal_port = 3000
  force_https = true
  # Torrents download in the background, so the machine must never sleep.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/api/me"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
